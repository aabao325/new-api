name: Sync with upstream

# fork 专用：每天把 QuantumNous/new-api 的 main 强制镜像到本仓库 main。
#
# 为什么是 force reset 而不是 merge：
#   本仓库不做任何本地开发，只用来跟踪上游。强制对齐永远不会冲突，也不会
#   累积 merge commit，与上游 diff 时噪音为零。
#
# 为什么必须用 PAT（secret SYNC_PAT）而不是内置的 GITHUB_TOKEN：
#   GITHUB_TOKEN 被禁止创建或更新 .github/workflows/** 下的文件，走 git push
#   还是 merge-upstream API 都一样（API 返回 422 "refusing to allow a GitHub
#   App to create or update workflow ... without `workflows` permission"）。
#   workflow 的 `permissions:` 键里没有 workflows 这一项，无法自行提权。
#   上游会改自己的 CI 配置，所以这条路是死的。
#   SYNC_PAT 需要三项写权限：Contents、Workflows、Issues。全程只用它、不用
#   GITHUB_TOKEN，所以不受仓库 Settings → Actions → Workflow permissions 的影响。
#
# main 与上游的唯一差异是本文件：镜像之后会把它单独 commit 回去，否则下一次
# 就没有 workflow 可跑了。
#
# 只同步 main 分支，不同步 tag：上游 tag 会触发 docker-build.yml / release.yml
# / electron-build.yml，对一个只用来看更新的 fork 是纯噪音。

on:
  schedule:
    # 每天 03:47 UTC（北京时间 11:47）。GitHub 定时任务是 best-effort，高负载时
    # 会延迟或跳过；另外公开仓库连续 60 天无提交活动会被自动停用定时任务。
    - cron: '47 3 * * *'
  workflow_dispatch:

# 同步本身全程用 SYNC_PAT。issues 权限只是 PAT 缺失时开失败 Issue 的兜底，
# 它受 Settings → Actions → Workflow permissions 限制，不保证可用。
permissions:
  contents: read
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/QuantumNous/new-api.git
  UPSTREAM_SLUG: QuantumNous/new-api
  BRANCH: main
  SELF: .github/workflows/sync-upstream.yml

jobs:
  sync:
    name: Mirror upstream/main into main
    # 只在这个 fork 里跑，避免被别人 fork 后到处触发。
    if: github.repository == 'aabao325/new-api'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check SYNC_PAT
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          if [ -z "${SYNC_PAT}" ]; then
            echo '::error::secret SYNC_PAT 未配置。到 https://github.com/settings/personal-access-tokens 新建 fine-grained PAT（Repository access 选本仓库，Repository permissions 勾 Contents / Workflows / Issues 三项 Read and write），再到本仓库 Settings → Secrets and variables → Actions 保存为 SYNC_PAT。'
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.SYNC_PAT }}
          fetch-depth: 0

      - name: Mirror upstream
        id: mirror
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          before="$(git rev-parse HEAD)"
          git fetch --no-tags "$UPSTREAM" "$BRANCH"
          upstream_head="$(git rev-parse FETCH_HEAD)"

          # 上游 head 已经在本地历史里 = 没有新东西，直接结束。
          if git merge-base --is-ancestor "$upstream_head" "$before"; then
            echo "Already up to date (${upstream_head})."
            echo "上游无更新（\`${upstream_head:0:7}\`）。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          base="$(git merge-base "$before" "$upstream_head")"
          count="$(git rev-list --count "${base}..${upstream_head}")"
          git log --oneline --max-count=60 "${base}..${upstream_head}" > commits.txt

          # reset 会连本文件一起抹掉，先把当前内容留出来。
          git show "${before}:${SELF}" > self.yml

          git reset --hard "$upstream_head"
          mkdir -p "$(dirname "$SELF")"
          cp self.yml "$SELF"
          rm -f self.yml
          git add -- "$SELF"
          if ! git diff --cached --quiet; then
            git commit -m 'ci: keep upstream sync workflow'
          fi

          # force-with-lease 钉住 checkout 时看到的 SHA：期间有别的推送就拒绝，
          # 不会把它冲掉。
          git push --force-with-lease="${BRANCH}:${before}" \
            origin "HEAD:refs/heads/${BRANCH}"

          {
            echo "### 上游同步完成"
            echo
            echo "带来 **${count}** 个新提交，本地 \`${BRANCH}\` 已对齐 \`${UPSTREAM_SLUG}@${upstream_head:0:7}\`。"
            echo
            echo "[查看上游 diff](https://github.com/${UPSTREAM_SLUG}/compare/${base}...${upstream_head})"
            echo
            echo '```'
            cat commits.txt
            if [ "$count" -gt 60 ]; then
              echo "... 以及另外 $((count - 60)) 个提交"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update failure issue
        if: failure()
        env:
          # PAT 优先；PAT 恰好就是缺失原因时退回 GITHUB_TOKEN，至少留个 Issue。
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          title='Upstream sync failed'
          label='upstream-sync-failed'

          # 标签不存在时先建，否则带 label 的搜索/创建都会失败。
          gh label create "$label" --color 'B60205' \
            --description 'Automatic upstream sync failed' 2>/dev/null || true

          existing="$(
            gh issue list --state open --label "$label" \
              --json number --jq '.[0].number // empty'
          )"

          # heredoc 里的反引号要转义，否则会被当成命令替换；${RUN_URL} 等需要展开，
          # 所以结束符不加引号。正文用 --body-file 传，省掉一层 shell 引号嵌套。
          cat > note.md <<EOF
          自动同步 \`${UPSTREAM_SLUG}\` → \`${BRANCH}\` 失败，本仓库未做任何改动。

          常见原因：

          - secret \`SYNC_PAT\` 未配置、已过期，或缺 Contents / Workflows / Issues 写权限
          - \`${BRANCH}\` 设了分支保护，禁止 force push
          - 期间有别的推送，\`--force-with-lease\` 拒绝覆盖（重跑一次即可）

          手动兜底：

          \`\`\`bash
          git fetch upstream ${BRANCH}
          git checkout ${BRANCH}
          git reset --hard upstream/${BRANCH}
          git push --force origin ${BRANCH}
          \`\`\`

          Run: ${RUN_URL}
          EOF

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file note.md
            echo "Commented on existing issue #${existing}."
          else
            gh issue create --title "$title" --label "$label" --body-file note.md
          fi
