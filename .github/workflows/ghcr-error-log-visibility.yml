name: Publish image to GHCR (error-log-visibility)

# Builds this branch into a personal GHCR image for self-hosted deployment
# (Baota / 宝塔 pulls it directly). Uses the built-in GITHUB_TOKEN, so no
# DOCKERHUB_* secrets are required. Action versions are SHA-pinned to match
# the other workflows in this repository.

on:
  push:
    branches:
      - fix/error-log-user-visibility
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag to publish (default: error-log-visibility)'
        required: false
        default: 'error-log-visibility'
        type: string

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/new-api
  TAG: ${{ github.event.inputs.tag || 'error-log-visibility' }}

jobs:
  build:
    name: Build & push (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Write VERSION
        # VERSION is empty in the repo; the Dockerfile bakes `cat VERSION` into
        # the binary, so give it something traceable back to this commit.
        run: echo "${TAG}-${GITHUB_SHA::7}" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.arch }}"
            echo '```'
            echo "${IMAGE}:${TAG}-${{ matrix.arch }}"
            echo "${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  manifest:
    name: Create multi-arch manifest
    needs: [build]
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifests
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          for t in "${TAG}" "${TAG}-${SHORT_SHA}"; do
            docker buildx imagetools create -t "${IMAGE}:${t}" \
              "${IMAGE}:${TAG}-amd64" \
              "${IMAGE}:${TAG}-arm64"
          done

      - name: Summary
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          {
            echo "### Pull command"
            echo '```bash'
            echo "docker pull ${IMAGE}:${TAG}"
            echo '```'
            echo "Pinned: \`${IMAGE}:${TAG}-${SHORT_SHA}\`"
            echo ''
            echo '```'
            docker buildx imagetools inspect "${IMAGE}:${TAG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
