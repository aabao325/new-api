name: Publish image to GHCR (error-log-visibility)

# Builds this branch into a personal GHCR image for self-hosted deployment
# (Baota / 宝塔 pulls it directly). Uses the built-in GITHUB_TOKEN, so no
# DOCKERHUB_* secrets are required. Action versions are SHA-pinned to match
# the other workflows in this repository.
#
# The repo-root VERSION file is the ONLY place the image version lives.
# Bumping VERSION is all that a version change requires — this workflow reads
# it back and derives every tag from it.

on:
  push:
    branches:
      - fix/error-log-user-visibility
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag to publish (leave empty to use VERSION)'
        required: false
        default: ''
        type: string

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/new-api

jobs:
  prepare:
    name: Resolve tag from VERSION
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Read VERSION
        id: version
        run: |
          tag="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$tag" ]; then
            echo "::error::VERSION is empty; fill it before building."
            exit 1
          fi
          echo "Resolved tag: ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    name: Build & push (${{ matrix.arch }})
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    env:
      # A manual run may override the tag; otherwise VERSION wins.
      TAG: ${{ github.event.inputs.tag || needs.prepare.outputs.tag }}

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Write VERSION
        # The Dockerfile bakes `cat VERSION` into the binary; add the commit
        # suffix so a running container can be traced back to a build.
        run: echo "${TAG}-${GITHUB_SHA::7}" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.arch }}"
            echo '```'
            echo "${IMAGE}:${TAG}-${{ matrix.arch }}"
            echo "${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  manifest:
    name: Create multi-arch manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest

    permissions:
      packages: write

    env:
      TAG: ${{ github.event.inputs.tag || needs.prepare.outputs.tag }}

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifests
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          # `latest` always follows the newest build of this branch.
          for t in "${TAG}" "latest" "${TAG}-${SHORT_SHA}"; do
            docker buildx imagetools create -t "${IMAGE}:${t}" \
              "${IMAGE}:${TAG}-amd64" \
              "${IMAGE}:${TAG}-arm64"
          done

      - name: Summary
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          {
            echo "### Pull command"
            echo '```bash'
            echo "docker pull ${IMAGE}:${TAG}"
            echo "docker pull ${IMAGE}:latest"
            echo '```'
            echo "Pinned: \`${IMAGE}:${TAG}-${SHORT_SHA}\`"
            echo ''
            echo '```'
            docker buildx imagetools inspect "${IMAGE}:${TAG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
