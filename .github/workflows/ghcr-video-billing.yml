name: Publish image to GHCR (video-billing)

# Builds this branch into a personal GHCR image for self-hosted deployment
# (Baota / 宝塔 pulls it directly). Uses the built-in GITHUB_TOKEN, so no
# DOCKERHUB_* secrets are required.

on:
  push:
    branches:
      - feat/video-output-billing
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag to publish (default: video-billing)'
        required: false
        default: 'video-billing'
        type: string

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/new-api
  TAG: ${{ github.event.inputs.tag || 'video-billing' }}

jobs:
  build:
    name: Build & push (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Write VERSION
        # VERSION is empty in the repo; the Dockerfile bakes `cat VERSION` into
        # the binary, so give it something traceable back to this commit.
        run: echo "${TAG}-${GITHUB_SHA::7}" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false

      - name: Summary
        run: |
          echo "### ${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${IMAGE}:${TAG}-${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  manifest:
    name: Create multi-arch manifest
    needs: [build]
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifests
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          for t in "${TAG}" "${TAG}-${SHORT_SHA}"; do
            docker buildx imagetools create -t "${IMAGE}:${t}" \
              "${IMAGE}:${TAG}-amd64" \
              "${IMAGE}:${TAG}-arm64"
          done

      - name: Summary
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          {
            echo "### Pull command"
            echo '```bash'
            echo "docker pull ${IMAGE}:${TAG}"
            echo '```'
            echo "Pinned: \`${IMAGE}:${TAG}-${SHORT_SHA}\`"
            echo ''
            echo '```'
            docker buildx imagetools inspect "${IMAGE}:${TAG}"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
